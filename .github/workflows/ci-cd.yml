name: AskLive Frontend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: 1. CI - Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build Frontend
        run: |
          npm ci
          npm run lint --if-present
          npm run build

      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-frontend
          path: dist/

  github-release:
    name: 2. Create GitHub Release
    needs: build-and-test
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: compiled-frontend
          path: ./release/

      - name: Zip build
        run: cd release && zip -r ../asklive-frontend.zip .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: asklive-frontend.zip
          draft: false
          prerelease: false

  deploy-to-vps:
    name: 3. CD - Deploy to VPS
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: compiled-frontend
          path: dist/

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/sj0rs1/asklive-frontend:${{ github.run_number }}

      - name: Connect to Fontys Netlab OpenVPN
        run: |
          sudo apt-get update && sudo apt-get install -y openvpn
          echo "${{ secrets.OPENVPN_USER }}" > vpn-auth.txt
          echo "${{ secrets.OPENVPN_PASSWORD }}" >> vpn-auth.txt
          echo "${{ secrets.OPENVPN_CONFIG }}" > client.ovpn
          chmod 600 vpn-auth.txt

          # Create the log as the runner user so grep can read it later
          touch vpn.log
          chmod 666 vpn.log

          sudo openvpn --config client.ovpn --auth-user-pass vpn-auth.txt \
            --daemon --log vpn.log --writepid vpn.pid

          # Wait up to 60s for the tunnel instead of a blind sleep
          for i in $(seq 1 30); do
            if grep -q "Initialization Sequence Completed" vpn.log 2>/dev/null; then
              echo "VPN connected"; break
            fi
            sleep 2
          done

          if ! grep -q "Initialization Sequence Completed" vpn.log; then
            echo "VPN failed to connect. Log:"
            cat vpn.log
            exit 1
          fi

          rm -f vpn-auth.txt

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull ghcr.io/sj0rs1/asklive-frontend:${{ github.run_number }}
            docker network create asklive_network 2>/dev/null || true

            docker rm -f asklive_frontend 2>/dev/null || true
            docker run -d --name asklive_frontend --network asklive_network \
              --restart unless-stopped \
              -p 80:80 \
              ghcr.io/sj0rs1/asklive-frontend:${{ github.run_number }}

            # Fail the pipeline if the frontend crashed, and print why
            sleep 15
            if [ "$(docker inspect -f '{{.State.Running}}' asklive_frontend)" != "true" ]; then
              docker logs --tail 100 asklive_frontend
              exit 1
            fi

            docker image prune -f