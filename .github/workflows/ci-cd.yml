name: AskLive Frontend CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4 # gets code from repository

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build frontend
        run: |
          npm ci
          npm run lint --if-present
          npm run build

      - name: Upload build to artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-frontend
          path: dist/
          if-no-files-found: error
          retention-days: 1

  github-release:
    name: Create GitHub Release
    needs: build-and-test
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: compiled-frontend
          path: ./release/

      - name: Zip build
        run: cd release && zip -r ../asklive-frontend.zip .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: asklive-frontend.zip

  deploy-to-vps:
    name: Deploy to VPS
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: compiled-frontend
          path: dist/

      - name: Install OpenVPN
        run: |
          sudo apt update
          sudo apt install -y openvpn openvpn-systemd-resolved

      - name: Write VPN config
        run: echo "${{ secrets.OPENVPN_CONFIG }}" > client.ovpn

      - name: Connect to VPN
        uses: kota65535/github-openvpn-connect-action@v3
        with:
          config_file: client.ovpn
          username: ${{ secrets.OPENVPN_USER }}
          password: ${{ secrets.OPENVPN_PASSWORD }}

      - name: Upload files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "dist,Dockerfile,deploy.sh"
          target: /home/sjors/asklive_frontend
          rm: true # wipes the target folder first so old build files don't pile up

      - name: Restart frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: bash ~/asklive_frontend/deploy.sh

  sonar:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Write VPN config
        run: echo "${{ secrets.OPENVPN_CONFIG }}" > client.ovpn

      - name: Connect to VPN
        uses: kota65535/github-openvpn-connect-action@v3
        with:
          config_file: client.ovpn
          username: ${{ secrets.OPENVPN_USER }}
          password: ${{ secrets.OPENVPN_PASSWORD }}

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: |
            -Dsonar.projectKey=sj0rs1_asklive_frontend
            -Dsonar.projectName=asklive_frontend
            -Dsonar.sources=src